<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f" />
      <stop offset="50%" stop-color="#0c131f" />
      <stop offset="100%" stop-color="#141a29" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Editorial Frame -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  
  <!-- Masthead Kicker -->
  <text x="70" y="80" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="4" font-weight="600">KRITRIMTA ALGORITHMIC SYSTEMS // ESSAY #16</text>
  <line x1="70" y1="96" x2="1130" y2="96" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Left Column: Editorial Typography & Thesis Deck -->
  <g transform="translate(70, 138)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="200" height="26" rx="4" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1"/>
    <text x="100" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.5">REASONING PARADIGM</text>

    <!-- Main Title -->
    <text x="0" y="70" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-1.2">THE INFERENCE</text>
    <text x="0" y="118" fill="url(#accent-cyan)" font-family="'Inter', -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-1.2">SCALING LAW</text>

    <!-- Subtitle Deck -->
    <text x="0" y="168" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="400">Why Test-Time Deliberation, Tree Search, and</text>
    <text x="0" y="194" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="400">Process Verifiers Broke the Pre-Training Monopoly.</text>

    <!-- Metadata Block -->
    <g transform="translate(0, 255)">
      <line x1="0" y1="0" x2="490" y2="0" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      
      <text x="0" y="30" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">AUTHOR</text>
      <text x="0" y="50" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Saurav Karki</text>

      <text x="160" y="30" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">PARADIGM SHIFT</text>
      <text x="160" y="50" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">System 1 ➔ System 2 Search</text>

      <text x="350" y="30" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">SCALING EQUATION</text>
      <text x="350" y="50" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">C_total = C_pre + C_test</text>
    </g>

    <!-- Stat Highlights -->
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="150" height="64" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="16" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="0.8">ZERO-SHOT COST</text>
      <text x="16" y="48" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">Diminishing</text>

      <rect x="165" y="0" width="150" height="64" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="181" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="0.8">TEST-TIME GAIN</text>
      <text x="181" y="48" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">+400% Pass@1</text>

      <rect x="330" y="0" width="160" height="64" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="346" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="0.8">VERIFIER TARGET</text>
      <text x="346" y="48" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">PRM &gt; ORM</text>
    </g>
  </g>

  <!-- Right Column: Interactive Diagrammatic Substrate -->
  <g transform="translate(610, 130)">
    <!-- Diagram Container Box -->
    <rect x="0" y="0" width="490" height="430" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" />
    
    <!-- Diagram Title Bar -->
    <rect x="0" y="0" width="490" height="38" rx="8" fill="rgba(30, 41, 59, 0.5)" />
    <line x1="0" y1="38" x2="490" y2="38" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="20" cy="19" r="4" fill="#ef4444" opacity="0.8"/>
    <circle cx="34" cy="19" r="4" fill="#f59e0b" opacity="0.8"/>
    <circle cx="48" cy="19" r="4" fill="#10b981" opacity="0.8"/>
    <text x="70" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">INSPECTION: SYSTEM 1 AUTOREGRESSION VS. SYSTEM 2 MCTS</text>

    <!-- Visual Search Tree & Path -->
    <!-- Root Node: Problem State -->
    <circle cx="245" cy="85" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow-cyan)" />
    <text x="245" y="89" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">S0</text>
    <text x="245" y="60" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">INPUT QUERY</text>

    <!-- Branch 1 (Left - Flawed Single-Pass Autoregression) -->
    <path d="M 235 98 L 120 165" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
    <circle cx="120" cy="165" r="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="120" y="169" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">x1</text>
    
    <path d="M 120 177 L 70 250" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
    <circle cx="70" cy="250" r="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="70" y="254" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">x2</text>

    <path d="M 70 260 L 50 330" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>
    <circle cx="50" cy="330" r="12" fill="#3b1219" stroke="#ef4444" stroke-width="2"/>
    <text x="50" y="334" fill="#ef4444" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle">&#10005;</text>
    <text x="50" y="358" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">HALLUCINATION</text>
    <text x="50" y="372" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">P = pⁿ Decay</text>

    <!-- Branch 2 (Center - Backtracked Path in Search Tree) -->
    <path d="M 245 101 L 245 165" stroke="#64748b" stroke-width="1.5" />
    <circle cx="245" cy="165" r="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="245" y="169" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">s1</text>

    <path d="M 245 177 L 200 245" stroke="#64748b" stroke-width="1.5" />
    <circle cx="200" cy="245" r="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="200" y="268" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">PRM: 0.31 (Pruned)</text>
    <!-- Pruning marker -->
    <line x1="192" y1="237" x2="208" y2="253" stroke="#ef4444" stroke-width="2"/>
    <line x1="208" y1="237" x2="192" y2="253" stroke="#ef4444" stroke-width="2"/>

    <!-- Branch 3 (Right - Verified Optimal System 2 Deliberation Path) -->
    <path d="M 255 98 L 370 160" stroke="#34d399" stroke-width="2.5" />
    <circle cx="370" cy="160" r="14" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#glow-emerald)" />
    <text x="370" y="164" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">s1*</text>
    
    <!-- PRM Step 1 Badge -->
    <rect x="400" y="148" width="75" height="22" rx="4" fill="rgba(52, 211, 153, 0.15)" stroke="#34d399" stroke-width="1"/>
    <text x="437" y="163" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">PRM: 0.98 &#10003;</text>

    <!-- Step 2 Optimal -->
    <path d="M 370 174 L 370 245" stroke="#34d399" stroke-width="2.5" />
    <circle cx="370" cy="245" r="14" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#glow-emerald)" />
    <text x="370" y="249" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">s2*</text>
    
    <!-- PRM Step 2 Badge -->
    <rect x="400" y="233" width="75" height="22" rx="4" fill="rgba(52, 211, 153, 0.15)" stroke="#34d399" stroke-width="1"/>
    <text x="437" y="248" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">PRM: 0.96 &#10003;</text>

    <!-- Sub-branch exploring from s2* -->
    <path d="M 360 255 L 305 315" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="305" cy="315" r="9" fill="#1e293b" stroke="#64748b" stroke-width="1"/>

    <!-- Terminal Step Optimal -->
    <path d="M 370 259 L 370 330" stroke="#34d399" stroke-width="3" />
    <circle cx="370" cy="330" r="16" fill="#064e3b" stroke="#34d399" stroke-width="3" filter="url(#glow-emerald)" />
    <text x="370" y="335" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">&#10003;</text>
    <text x="370" y="360" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">PROVEN SOLUTION</text>
    <text x="370" y="375" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Verified Step-by-Step</text>

    <!-- Bottom Legend Banner -->
    <rect x="15" y="390" width="460" height="28" rx="4" fill="rgba(15, 23, 42, 0.9)" />
    <circle cx="35" cy="404" r="4" fill="#ef4444" />
    <text x="45" y="407" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Linear Autoregression (O(1) Pass)</text>

    <circle cx="230" cy="404" r="4" fill="#34d399" />
    <text x="240" y="407" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Test-Time Tree Search + PRM Checkpoints</text>
  </g>
</svg>
