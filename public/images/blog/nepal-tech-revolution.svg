<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-tech" cx="65%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#e0532b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b0e14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="circuit-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b2432" stroke-width="0.75"/>
    </pattern>
    <linearGradient id="tech-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#e0532b"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#090c12"/>
  <rect width="1200" height="630" fill="url(#circuit-grid)"/>
  <rect width="1200" height="630" fill="url(#glow-tech)"/>

  <!-- Top Badge -->
  <rect x="70" y="60" width="230" height="30" rx="6" fill="#151d2a" stroke="#2a384c" stroke-width="1"/>
  <text x="85" y="80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="2">KRITRIMTA · DISPATCHES</text>
  <text x="1130" y="80" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" text-anchor="end">SPECIAL REPORT // HIMALAYAN TECH</text>

  <!-- Right Visual Graphics: Silicon & Fiber Network Over Himalayas -->
  <g transform="translate(680, 130)">
    <!-- Himalayan Stylized Ridge -->
    <path d="M-40 380 L80 260 L180 330 L300 170 L420 280 L520 180 L600 240 L600 400 L-40 400 Z" 
          fill="#111827" stroke="#253549" stroke-width="1.5" opacity="0.8"/>

    <!-- Network / Fiber Constellation Lines -->
    <g stroke="#38bdf8" stroke-width="1.5" opacity="0.7" fill="none">
      <line x1="120" y1="260" x2="220" y2="180"/>
      <line x1="220" y1="180" x2="300" y2="170"/>
      <line x1="300" y1="170" x2="380" y2="230"/>
      <line x1="380" y1="230" x2="480" y2="160"/>
      <line x1="220" y1="180" x2="280" y2="280"/>
      <line x1="280" y1="280" x2="380" y2="230"/>
    </g>

    <!-- Node Points -->
    <circle cx="120" cy="260" r="5" fill="#38bdf8"/>
    <circle cx="220" cy="180" r="7" fill="#e0532b"/>
    <circle cx="300" cy="170" r="8" fill="#38bdf8"/>
    <circle cx="380" cy="230" r="6" fill="#f59e0b"/>
    <circle cx="480" cy="160" r="7" fill="#10b981"/>
    <circle cx="280" cy="280" r="5" fill="#38bdf8"/>

    <!-- Concentric radar ring over central hub (Kathmandu) -->
    <circle cx="300" cy="170" r="40" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="300" cy="170" r="80" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>

    <!-- Chip Architecture Box -->
    <g transform="translate(180, 260)">
      <rect width="180" height="70" rx="8" fill="#151f2e" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="90" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">5G &bull; FINTECH &bull; AI</text>
      <text x="90" y="50" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">DIGITAL NEPAL STACK</text>
    </g>
  </g>

  <!-- Headline & Editorial Content -->
  <text x="70" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="3">DEEP DIVE // ECOSYSTEM BENCHMARK</text>
  
  <text x="70" y="300" font-family="'Newsreader', Georgia, serif" font-size="54" font-weight="700" fill="#f8fafc" letter-spacing="-1">Nepal's Tech</text>
  <text x="70" y="360" font-family="'Newsreader', Georgia, serif" font-size="54" font-weight="700" fill="url(#tech-gradient)" letter-spacing="-1">Revolution 2026</text>
  
  <text x="70" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" fill="#94a3b8">
    How a new generation of engineers, fintech rails &amp; startups
  </text>
  <text x="70" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" fill="#94a3b8">
    is actively reshaping the Himalayan nation's digital trajectory.
  </text>

  <!-- Editorial Metadata Bottom Bar -->
  <line x1="70" y1="520" x2="1130" y2="520" stroke="#1e293b" stroke-width="1"/>
  <text x="70" y="555" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748b">BY SAURAV KARKI</text>
  <text x="320" y="555" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748b">CATEGORY: TECH NEWS</text>
  <text x="600" y="555" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748b">READING TIME: 9 MIN</text>
  <text x="1130" y="555" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#e0532b" text-anchor="end">KRITRIMTA.COM</text>
</svg>
