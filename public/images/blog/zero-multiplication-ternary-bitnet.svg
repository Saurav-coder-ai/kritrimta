<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#101726" />
    </linearGradient>
    <linearGradient id="cyan-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f5a0" />
    </linearGradient>
    <linearGradient id="accent-box" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.12)" />
      <stop offset="100%" stop-color="rgba(0, 245, 160, 0.08)" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Editorial Frame -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1.5" />

  <!-- Masthead Kicker -->
  <text x="70" y="80" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="4" font-weight="600">KRITRIMTA ARCHITECTURE LABS // FIRST-PRINCIPLES DISSECTION</text>
  <line x1="70" y1="96" x2="1130" y2="96" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />

  <!-- Left Editorial Content -->
  <g transform="translate(70, 150)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="28" rx="6" fill="rgba(0, 245, 160, 0.12)" stroke="#00f5a0" stroke-width="1" />
    <text x="110" y="18" fill="#00f5a0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">SILICON &amp; QUANTIZATION</text>

    <!-- Main Title -->
    <text x="0" y="70" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      The Zero-Multiplication
    </text>
    <text x="0" y="118" fill="url(#cyan-emerald)" font-family="'Inter', system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Revolution: 1.58-Bit AI
    </text>

    <!-- Subtitle / Hook -->
    <text x="0" y="165" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="400">
      <tspan x="0" dy="0">Why BitNet's ternary weights {-1, 0, +1} replace power-hungry</tspan>
      <tspan x="0" dy="24">FP16 matrix multiplications with pure integer additions,</tspan>
      <tspan x="0" dy="24">shattering the GPU memory wall and silicon cost monopoly.</tspan>
    </text>

    <!-- Key Metrics Display Card -->
    <g transform="translate(0, 255)">
      <rect x="0" y="0" width="490" height="96" rx="8" fill="url(#accent-box)" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1" />
      
      <!-- Stat 1 -->
      <text x="24" y="36" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700">0.03 pJ</text>
      <text x="24" y="58" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">TERNARY ADD ENERGY</text>
      <text x="24" y="74" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">vs 3.7 pJ FP16 MAC (120×)</text>

      <line x1="175" y1="18" x2="175" y2="78" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

      <!-- Stat 2 -->
      <text x="195" y="36" fill="#00f5a0" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700">13.8 GB</text>
      <text x="195" y="58" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">70B PARAM WEIGHTS</text>
      <text x="195" y="74" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Fits on Single M3/M4 RAM</text>

      <line x1="335" y1="18" x2="335" y2="78" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

      <!-- Stat 3 -->
      <text x="355" y="36" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700">ZERO</text>
      <text x="355" y="58" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">FP MULTIPLIERS</text>
      <text x="355" y="74" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Pure Accumulator Crossbars</text>
    </g>

    <!-- Byline -->
    <text x="0" y="390" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">
      BY <tspan fill="#e2e8f0">SAURAV KARKI</tspan> // CHIEF EDITOR // KRITRIMTA
    </text>
  </g>

  <!-- Right Schematic: Matrix Multiplier vs Ternary Accumulator -->
  <g transform="translate(640, 140)">
    <rect x="0" y="0" width="480" height="420" rx="12" fill="#080d16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <line x1="0" y1="46" x2="480" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="24" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2">ARITHMETIC SUBSTRATE COMPARISON</text>

    <!-- Regime A: Classical GPU FP16 MAC -->
    <g transform="translate(24, 65)">
      <text x="0" y="0" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">A. CONVENTIONAL GPU TENSOR CORE (FP16/FP8)</text>
      <text x="0" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Requires massive silicon area, high heat, and HBM3e bandwidth</text>

      <rect x="0" y="30" width="125" height="34" rx="4" fill="rgba(239, 68, 68, 0.1)" stroke="#ef4444" stroke-width="1"/>
      <text x="62" y="52" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">FP16 Weight W_ij</text>

      <text x="138" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14">✕</text>

      <rect x="155" y="30" width="125" height="34" rx="4" fill="rgba(239, 68, 68, 0.1)" stroke="#ef4444" stroke-width="1"/>
      <text x="217" y="52" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">FP16 Activation X_j</text>

      <text x="292" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14">➔</text>

      <rect x="310" y="30" width="120" height="34" rx="4" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="370" y="52" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">MAC Tree Accum</text>

      <text x="0" y="85" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="10">↳ Power: ~3.7 pJ/op | Die Area: Heavy FPU multipliers</text>
    </g>

    <!-- Separator -->
    <line x1="24" y1="180" x2="456" y2="180" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />

    <!-- Regime B: BitNet b1.58 Ternary Linear Algebra -->
    <g transform="translate(24, 205)">
      <text x="0" y="0" fill="#00f5a0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">B. BITNET b1.58 TERNARY ENGINE (ZERO MULTIPLY)</text>
      <text x="0" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Eliminates multipliers entirely; turns GEMM into INT8 Add/Sub</text>

      <!-- Weight states -->
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="130" height="42" rx="4" fill="rgba(0, 245, 160, 0.1)" stroke="#00f5a0" stroke-width="1.5"/>
        <text x="65" y="18" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">W_ij ∈ {-1, 0, +1}</text>
        <text x="65" y="34" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Ternary (1.58 bits)</text>
      </g>

      <text x="145" y="55" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="16">➔</text>

      <!-- Demux / Routing Logic -->
      <g transform="translate(170, 30)">
        <rect x="0" y="0" width="125" height="42" rx="4" fill="rgba(0, 242, 254, 0.1)" stroke="#00f2fe" stroke-width="1.5"/>
        <text x="62" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Conditional Add/Sub</text>
        <text x="62" y="34" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">No Multiplier Unit</text>
      </g>

      <text x="310" y="55" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="16">➔</text>

      <!-- Output accumulator -->
      <g transform="translate(330, 30)">
        <rect x="0" y="0" width="102" height="42" rx="4" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1"/>
        <text x="51" y="18" fill="#d8b4fe" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">INT32 Acc</text>
        <text x="51" y="34" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">y_i = Σ(+X) - Σ(-X)</text>
      </g>

      <text x="0" y="98" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">↳ Power: ~0.03 pJ/op (100× cheaper) | Memory: 80-90% saving</text>
    </g>

    <!-- Bottom Architectural Callout -->
    <g transform="translate(24, 340)">
      <rect x="0" y="0" width="432" height="52" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="16" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">THEORETICAL SILICON EFFICIENCY DELTA:</text>
      <text x="16" y="40" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">
        Additive ASICs yield <tspan fill="#00f5a0" font-weight="700">10× silicon density</tspan> &amp; <tspan fill="#00f2fe" font-weight="700">zero floating-point debt</tspan>.
      </text>
    </g>
  </g>
</svg>
