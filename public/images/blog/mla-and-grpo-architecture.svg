<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f" />
      <stop offset="50%" stop-color="#0c121c" />
      <stop offset="100%" stop-color="#141a26" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#3a7bd5" />
      <stop offset="100%" stop-color="#9d50bb" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Editorial Frame -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
  
  <!-- Masthead Kicker -->
  <text x="70" y="80" fill="#00d2ff" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="4" font-weight="600">KRITRIMTA ARCHITECTURE LABS // DEEP DIVE REPORT</text>
  <line x1="70" y1="96" x2="1130" y2="96" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Right Side: Architectural Schematic (MLA & GRPO Flow) -->
  <g transform="translate(670, 150)">
    <rect x="0" y="0" width="460" height="400" rx="12" fill="#0b0f17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <line x1="0" y1="46" x2="460" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="24" y="30" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2">MLA &amp; GRPO MECHANICAL SUBSTRATE</text>

    <!-- Schema 1: Multi-Head Latent Attention (MLA) -->
    <g transform="translate(25, 70)">
      <text x="0" y="0" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">1. MULTI-HEAD LATENT ATTENTION (KV COMPRESSION)</text>
      
      <!-- Input Vector -->
      <rect x="0" y="15" width="70" height="32" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="35" y="35" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Input h_t</text>

      <!-- Arrow -->
      <path d="M 75 31 L 95 31" stroke="#00d2ff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
      <polygon points="98,31 92,27 92,35" fill="#00d2ff" />

      <!-- Latent Vector (Small KV Cache) -->
      <rect x="105" y="15" width="115" height="32" rx="4" fill="rgba(0, 210, 255, 0.15)" stroke="#00d2ff" stroke-width="1.5"/>
      <text x="162" y="35" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Latent c_t^(KV)</text>

      <!-- Arrow -->
      <polygon points="238,31 232,27 232,35" fill="#00d2ff" />
      <path d="M 225 31 L 235 31" stroke="#00d2ff" stroke-width="1.5" fill="none"/>

      <!-- Decompressed Multi-Head -->
      <rect x="245" y="15" width="165" height="32" rx="4" fill="rgba(157, 80, 187, 0.15)" stroke="#9d50bb" stroke-width="1"/>
      <text x="327" y="35" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Decoupled RoPE + Heads</text>
      
      <text x="0" y="65" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">↳ KV Cache reduction: 93.3% vs Standard MHA</text>
    </g>

    <!-- Schema 2: GRPO (Group Relative Policy Optimization) -->
    <g transform="translate(25, 175)">
      <line x1="0" y1="0" x2="410" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="0" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">2. GROUP RELATIVE POLICY OPTIMIZATION (NO CRITIC)</text>

      <!-- Prompt Node -->
      <rect x="0" y="40" width="80" height="45" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="40" y="66" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Prompt q</text>

      <!-- Rollouts Group -->
      <g transform="translate(100, 36)">
        <rect x="0" y="0" width="130" height="16" rx="3" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1"/>
        <text x="65" y="12" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Rollout o_1 (Reward: 1.0)</text>

        <rect x="0" y="20" width="130" height="16" rx="3" fill="rgba(244, 63, 94, 0.12)" stroke="#f43f5e" stroke-width="1"/>
        <text x="65" y="32" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Rollout o_2 (Reward: 0.0)</text>

        <rect x="0" y="40" width="130" height="16" rx="3" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1"/>
        <text x="65" y="52" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Rollout o_G (Reward: 1.0)</text>
      </g>

      <!-- Arrow -->
      <polygon points="252,62 246,58 246,66" fill="#38bdf8" />
      <path d="M 235 62 L 249 62" stroke="#38bdf8" stroke-width="1.5" fill="none"/>

      <!-- Relative Advantage Computation -->
      <rect x="258" y="40" width="150" height="48" rx="4" fill="rgba(34, 197, 94, 0.15)" stroke="#22c55e" stroke-width="1.5"/>
      <text x="333" y="60" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Relative Advantage</text>
      <text x="333" y="78" fill="#86efac" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">A_i = (r_i - μ) / σ</text>
      
      <text x="0" y="112" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">↳ Zero Critic VRAM overhead; pure verifiable reward</text>
    </g>

    <!-- Schema 3: Memory Efficiency Metrics -->
    <g transform="translate(25, 320)">
      <rect x="0" y="0" width="410" height="58" rx="6" fill="#06090e" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="15" y="24" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">KV PER TOKEN</text>
      <text x="15" y="44" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">0.07 KB (MLA)</text>
      
      <line x1="135" y1="12" x2="135" y2="48" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="150" y="24" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">STANDARD GQA</text>
      <text x="150" y="44" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14">0.54 KB</text>

      <line x1="275" y1="12" x2="275" y2="48" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="290" y="24" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">RL MEMORY GAIN</text>
      <text x="290" y="44" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">+50% VRAM Free</text>
    </g>
  </g>

  <!-- Left Main Editorial Title & Copy -->
  <g transform="translate(70, 175)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="190" height="32" rx="4" fill="rgba(0, 210, 255, 0.12)" stroke="#00d2ff" stroke-width="1"/>
    <text x="14" y="21" fill="#00d2ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1">ARCHITECTURE DEEP DIVE</text>

    <!-- Main Headline -->
    <text x="0" y="80" fill="#ffffff" font-family="'Newsreader', Georgia, serif" font-size="44" font-weight="700" letter-spacing="-0.5">The Anatomy of</text>
    <text x="0" y="132" fill="#38bdf8" font-family="'Newsreader', Georgia, serif" font-size="44" font-weight="700" letter-spacing="-0.5">Efficient Reasoning</text>

    <!-- Subtitle / Analytical Hook -->
    <text x="0" y="195" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="400">How Multi-Head Latent Attention &amp; GRPO</text>
    <text x="0" y="225" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="500">Broke the Brute-Force Scaling Monopoly</text>

    <!-- Technical Specs Tag Box -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="550" height="60" rx="8" fill="#0b0f17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="20" y="35" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">KV CACHE COMPRESSION</text>
      <text x="195" y="35" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="12">|</text>
      <text x="215" y="35" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">CRITIC-FREE RL</text>
      <text x="345" y="35" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="12">|</text>
      <text x="365" y="35" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="12">TEST-TIME COMPUTE</text>
    </g>
  </g>

  <!-- Bottom Colophon -->
  <text x="70" y="570" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12">KRITRIMTA JOURNAL // ARCHITECTURE SERIES // SAURAV KARKI</text>
  <text x="1130" y="570" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="end">FIRST-PRINCIPLES SILICON &amp; AI REVIEW</text>
</svg>
