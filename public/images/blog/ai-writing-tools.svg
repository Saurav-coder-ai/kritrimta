<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e0532b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#12161f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#232b38" stroke-width="0.75"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f131a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Editorial Stamp -->
  <rect x="70" y="60" width="170" height="28" rx="4" fill="#1b222e" stroke="#2e3848" stroke-width="1"/>
  <text x="85" y="78" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="600" fill="#e0532b" letter-spacing="2">KRITRIMTA · EVAL</text>
  <text x="1130" y="80" font-family="'JetBrains Mono', monospace" font-size="12" fill="#586578" text-anchor="end">ISSUE #26-08 // FIELD TEST</text>
  
  <!-- Architectural drafting graphics -->
  <g stroke="#2c3647" stroke-width="1.5" fill="none">
    <circle cx="780" cy="315" r="180" stroke-dasharray="4 6"/>
    <circle cx="780" cy="315" r="120"/>
    <circle cx="780" cy="315" r="60" stroke="#e0532b" stroke-width="2"/>
    <line x1="560" y1="315" x2="1000" y2="315"/>
    <line x1="780" y1="95" x2="780" y2="535"/>
  </g>
  
  <!-- Typographic Glyph / Editorial visual -->
  <text x="780" y="365" font-family="Georgia, serif" font-size="160" font-weight="700" fill="#e0532b" fill-opacity="0.85" text-anchor="middle">¶</text>
  <circle cx="680" cy="230" r="6" fill="#e0532b"/>
  <circle cx="880" cy="400" r="6" fill="#e0532b"/>
  <line x1="680" y1="230" x2="880" y2="400" stroke="#e0532b" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Headline typography -->
  <text x="70" y="270" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#f5f0eb" letter-spacing="-1">The Synthetics</text>
  <text x="70" y="335" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#e0532b" letter-spacing="-1">of Modern Prose</text>
  
  <text x="70" y="400" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#8f9eb2" max-width="500">
    A benchmark of 8 autonomous writing engines for depth, tone &amp; factual fidelity.
  </text>

  <!-- Editorial Metadata bar -->
  <line x1="70" y1="520" x2="1130" y2="520" stroke="#232c3a" stroke-width="1"/>
  <text x="70" y="555" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6c7c91">BY SAURAV KARKI</text>
  <text x="320" y="555" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6c7c91">CATEGORY: AI TOOLS</text>
  <text x="600" y="555" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6c7c91">READING TIME: 6 MIN</text>
  <text x="1130" y="555" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e0532b" text-anchor="end">KRITRIMTA.COM</text>
