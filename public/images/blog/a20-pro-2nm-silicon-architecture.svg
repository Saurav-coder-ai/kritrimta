<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid3" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="520" fill="url(#bg3)" />
  <rect width="1000" height="520" fill="url(#grid3)" />
  <rect x="20" y="20" width="960" height="480" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Title Header -->
  <text x="50" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="3" font-weight="600">FIG 2.1 // SUBSTRATE LITHOGRAPHY &amp; DIE FLOORPLAN</text>
  <text x="50" y="85" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800">Apple A20 Pro: TSMC 2nm (N2) Gate-All-Around Nanosheet Topology</text>
  <line x1="50" y1="105" x2="950" y2="105" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Left: 3nm FinFET vs 2nm Nanosheet / GAAFET Transistor Comparison -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="430" height="330" rx="8" fill="#0b0f17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="20" y="30" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">TRANSISTOR ARCHITECTURE REVOLUTION</text>

    <!-- 3nm FinFET Diagram -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="160" height="110" rx="6" fill="#1e1b2e" stroke="#8b5cf6" stroke-width="1"/>
      <text x="80" y="22" fill="#c4b5fd" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">3nm N3E (FinFET)</text>
      <!-- Fin visual: 3 sides gated -->
      <rect x="65" y="40" width="30" height="50" fill="#6d28d9"/>
      <path d="M 50 45 L 110 45 L 110 90 L 50 90 Z" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <text x="80" y="105" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">3-Sided Gate Contact</text>
    </g>

    <!-- 2nm Nanosheet / GAAFET Diagram -->
    <g transform="translate(230, 60)">
      <rect x="0" y="0" width="160" height="110" rx="6" fill="#062e24" stroke="#10b981" stroke-width="1.5"/>
      <text x="80" y="22" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">2nm N2 (GAA Nanosheet)</text>
      <!-- Stacked Nanosheets surrounded 360 deg -->
      <rect x="55" y="40" width="50" height="8" rx="2" fill="#059669" stroke="#34d399" stroke-width="1"/>
      <rect x="55" y="55" width="50" height="8" rx="2" fill="#059669" stroke="#34d399" stroke-width="1"/>
      <rect x="55" y="70" width="50" height="8" rx="2" fill="#059669" stroke="#34d399" stroke-width="1"/>
      <text x="80" y="105" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">4-Sided 360° Wrap-Around Gate</text>
    </g>

    <!-- Metrics box -->
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="390" height="120" rx="6" fill="#07101a" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
      <text x="15" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">PHYSICAL SILICON METRICS (N2 vs N3E):</text>
      <text x="15" y="48" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Transistor Density: +15% increase (~200M Tr/mm²)</text>
      <text x="15" y="70" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Energy Dissipation: -28% to -30% power at identical clock</text>
      <text x="15" y="92" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Subthreshold Leakage Current: Slashed by 40% via GAA</text>
    </g>
  </g>

  <!-- Right: A20 Pro Die Floorplan Breakdown -->
  <g transform="translate(510, 130)">
    <rect x="0" y="0" width="440" height="330" rx="8" fill="#0b0f17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="20" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">A20 PRO DIE FLOORPLAN // ON-DEVICE AI ACCELERATION</text>

    <!-- CPU Complex -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="195" height="110" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="15" y="22" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">6-CORE CPU</text>
      <text x="15" y="44" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">2× Everest-II Perf Cores</text>
      <text x="15" y="60" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Peak Clock: 4.45 GHz</text>
      <text x="15" y="82" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">4× Sawtooth-II Efficiency</text>
      <text x="15" y="98" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Sub-100mW Static Draw</text>
    </g>

    <!-- GPU Complex -->
    <g transform="translate(225, 55)">
      <rect x="0" y="0" width="195" height="110" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="15" y="22" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">6-CORE PRO GPU</text>
      <text x="15" y="44" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Hardware Ray Tracing Gen 3</text>
      <text x="15" y="62" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Dynamic Caching 2.0</text>
      <text x="15" y="82" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Neural Rendering Shader Engine</text>
    </g>

    <!-- Neural Engine -->
    <g transform="translate(20, 180)">
      <rect x="0" y="0" width="400" height="65" rx="6" fill="#31135e" stroke="#a855f7" stroke-width="1.2"/>
      <text x="15" y="24" fill="#d8b4fe" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">16-CORE NEXT-GEN NEURAL ENGINE (NPU)</text>
      <text x="15" y="45" fill="#f3e8ff" font-family="'Inter', sans-serif" font-size="10">45+ INT8/FP8 TOPS // Native 7B-parameter MLLM On-Device Weights Compression</text>
    </g>

    <!-- Unified Memory Subsystem -->
    <g transform="translate(20, 260)">
      <rect x="0" y="0" width="400" height="50" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="22" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">12GB / 16GB LPDDR5X UNIFIED MEMORY (8533 MT/s)</text>
      <text x="15" y="38" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="9">Bandwidth: 136.5 GB/s (Sustains real-time 35 tok/s local Apple Intelligence)</text>
    </g>
  </g>
</svg>
