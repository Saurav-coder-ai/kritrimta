<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-nepal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f" />
      <stop offset="50%" stop-color="#0d1522" />
      <stop offset="100%" stop-color="#182234" />
    </linearGradient>
    <linearGradient id="nepal-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <pattern id="grid-nepal" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-nepal)" />
  <rect width="1200" height="630" fill="url(#grid-nepal)" />
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Kicker -->
  <text x="70" y="80" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="4" font-weight="600">KRITRIMTA GADGET LABS // NEPAL TECH DISPATCH</text>
  <line x1="70" y1="96" x2="1130" y2="96" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Left Column -->
  <g transform="translate(70, 140)">
    <rect x="0" y="0" width="175" height="24" rx="4" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1"/>
    <text x="87" y="16" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">OFFICIAL BUYING GUIDE</text>

    <text x="0" y="65" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="38" font-weight="800">
      <tspan x="0" dy="0">iPhone 18 Pro</tspan>
      <tspan x="0" dy="46">Price in Nepal</tspan>
    </text>

    <text x="0" y="170" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="16">
      <tspan x="0" dy="0">Official Expected Launch Prices, Genxt Warranty, MDMS</tspan>
      <tspan x="0" dy="24">Registration, 2nm A20 Pro &amp; Variable Aperture Camera.</tspan>
    </text>

    <g transform="translate(0, 235)">
      <circle cx="16" cy="16" r="16" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="16" y="21" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">SK</text>
      <text x="44" y="14" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Saurav Karki</text>
      <text x="44" y="28" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Chief Editor // Sep 10, 2026</text>
    </g>

    <!-- Key Metrics Badges -->
    <g transform="translate(0, 305)">
      <rect x="0" y="0" width="140" height="42" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="14" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1">STARTING PRICE</text>
      <text x="14" y="34" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">NPR 264,000</text>

      <rect x="155" y="0" width="140" height="42" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="169" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1">AUTHORIZED DIST.</text>
      <text x="169" y="34" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">Genxt / Oliz / Evo</text>

      <rect x="310" y="0" width="140" height="42" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="324" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1">COMPLIANCE</text>
      <text x="324" y="34" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">NTA MDMS Ready</text>
    </g>
  </g>

  <!-- Right Column: Illustrated Product & Price Card -->
  <g transform="translate(640, 130)">
    <rect x="0" y="0" width="490" height="430" rx="12" fill="#0b0f17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <line x1="0" y1="46" x2="490" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="24" y="29" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2">NEPAL MARKET PRICING MATRIX</text>

    <!-- Pricing rows -->
    <g transform="translate(20, 65)">
      <!-- 256GB -->
      <rect x="0" y="0" width="450" height="52" rx="6" fill="#0f172a" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="18" y="25" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">iPhone 18 Pro (12GB / 256GB)</text>
      <text x="18" y="42" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Global MSRP: $1,199 // 6.3" ProMotion OLED</text>
      <text x="430" y="33" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" text-anchor="end">NPR 264,000</text>

      <!-- 512GB -->
      <g transform="translate(0, 62)">
        <rect x="0" y="0" width="450" height="52" rx="6" fill="#0f172a" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
        <text x="18" y="25" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">iPhone 18 Pro (12GB / 512GB)</text>
        <text x="18" y="42" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Global MSRP: $1,399 // 48MP Triple Camera</text>
        <text x="430" y="33" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" text-anchor="end">NPR 304,000</text>
      </g>

      <!-- 1TB -->
      <g transform="translate(0, 124)">
        <rect x="0" y="0" width="450" height="52" rx="6" fill="#0f172a" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
        <text x="18" y="25" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">iPhone 18 Pro (12GB / 1TB)</text>
        <text x="18" y="42" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Global MSRP: $1,799 // ProRes RAW &amp; Log 2</text>
        <text x="430" y="33" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" text-anchor="end">NPR 384,000</text>
      </g>

      <!-- 2TB -->
      <g transform="translate(0, 186)">
        <rect x="0" y="0" width="450" height="52" rx="6" fill="#0f172a" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
        <text x="18" y="25" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">iPhone 18 Pro (12GB / 2TB)</text>
        <text x="18" y="42" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Global MSRP: $2,399 // Maximum Storage Tier</text>
        <text x="430" y="33" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" text-anchor="end">NPR 504,000</text>
      </g>
    </g>

    <!-- Bottom Notice -->
    <g transform="translate(20, 325)">
      <rect x="0" y="0" width="450" height="85" rx="6" fill="#071524" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
      <text x="18" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">NEPAL AVAILABILITY &amp; AUTHENTICITY:</text>
      <text x="18" y="44" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• Official pre-orders open October 2026 across Kathmandu &amp; Pokhara</text>
      <text x="18" y="62" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• Includes 1-year official warranty, 1-year breakage insurance &amp; VAT bill</text>
    </g>
  </g>
</svg>
