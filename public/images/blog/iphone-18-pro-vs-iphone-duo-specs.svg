    <g transform="translate(20, 60)">
      <text x="0" y="15" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">BASE PRICE / RELEASE</text>
      <text x="0" y="32" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">$1,299 // Sep 18, 2026</text>

      <line x1="0" y1="44" x2="270" y2="44" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <text x="0" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">DISPLAY CONFIGURATION</text>
      <text x="0" y="77" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">6.9" Super Retina XDR ProMotion</text>
      <text x="0" y="93" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">3,000 nits peak, Border Reduction 2.0</text>

      <line x1="0" y1="105" x2="270" y2="105" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <text x="0" y="121" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">SILICON &amp; NPU</text>
      <text x="0" y="138" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">A20 Pro (TSMC 2nm GAAFET)</text>
      <text x="0" y="154" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">12GB LPDDR5X // Extended Vapor Chamber</text>

      <line x1="0" y1="166" x2="270" y2="166" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <text x="0" y="182" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">PRIMARY OPTICAL STACK</text>
      <text x="0" y="199" fill="#10b981" font-family="'Inter', sans-serif" font-size="13" font-weight="600">48MP Variable f/1.5-f/4.0</text>
      <text x="0" y="215" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">6× Periscope Telephoto (144mm equiv.)</text>

      <line x1="0" y1="227" x2="270" y2="227" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <text x="0" y="243" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">MASS &amp; CHASSIS</text>
      <text x="0" y="260" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">224g // 8.2mm Thickness</text>
      <text x="0" y="276" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Largest iPhone Battery Ever (~5,000 mAh)</text>
    </g>
  </g>

  <!-- Column 3: iPhone Duo (Foldable) -->
  <g transform="translate(730, 125)">
    <rect x="0" y="0" width="320" height="390" rx="8" fill="#0b0f17" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="42" rx="8" fill="#451a03"/>
    <text x="160" y="26" fill="#fef3c7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">iPHONE DUO (FOLDABLE)</text>

    <g transform="translate(20, 60)">
      <text x="0" y="15" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10">BASE PRICE / RELEASE</text>
      <text x="0" y="32" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="13" font-weight="700">$1,999 // Oct 23, 2026</text>

      <line x1="0" y1="44" x2="280" y2="44" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <text x="0" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">DUAL DISPLAY TOPOLOGY</text>
      <text x="0" y="77" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">7.6" Inner Nano-UTG (Crease-less)</text>
      <text x="0" y="93" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10">5.4" Outer Compact Cover Display</text>

      <line x1="0" y1="105" x2="280" y2="105" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <text x="0" y="121" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">SILICON &amp; NPU</text>
      <text x="0" y="138" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">A20 Pro (TSMC 2nm GAAFET)</text>
      <text x="0" y="154" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10">16GB LPDDR5X (Unified Foldable OS)</text>

      <line x1="0" y1="166" x2="280" y2="166" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <text x="0" y="182" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">OPTICAL &amp; BIOMETRIC</text>
      <text x="0" y="199" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Dual 48MP Fusion + Under-Display Cam</text>
      <text x="0" y="215" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Slim Profile Modules (Fixed Aperture)</text>

      <line x1="0" y1="227" x2="280" y2="227" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <text x="0" y="243" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">CHASSIS, MASS &amp; RESISTANCE</text>
      <text x="0" y="260" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">238g // 4.9mm Unfolded (9.8mm Closed)</text>
      <text x="0" y="276" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">100-Part Liquidmetal Hinge // IP68 Rating</text>
    </g>
