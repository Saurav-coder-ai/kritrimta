<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f" />
      <stop offset="50%" stop-color="#0c121c" />
      <stop offset="100%" stop-color="#141a26" />
    </linearGradient>
    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Editorial Frame -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  
  <!-- Masthead Kicker -->
  <text x="70" y="80" fill="#00d2ff" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="4" font-weight="600">KRITRIMTA SILICON &amp; ARCHITECTURE // ESSAY #15</text>
  <line x1="70" y1="96" x2="1130" y2="96" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Left Side: Editorial Typography -->
  <g transform="translate(70, 140)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="168" height="26" rx="4" fill="rgba(0, 210, 255, 0.1)" stroke="#00d2ff" stroke-width="1"/>
    <text x="84" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.5">SILICON SUBSTRATE</text>

    <!-- Main Title -->
    <text x="0" y="70" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="40" font-weight="800" letter-spacing="-1.2">THE DEATH OF MATRIX</text>
    <text x="0" y="122" fill="url(#accent-cyan)" font-family="'Inter', -apple-system, sans-serif" font-size="40" font-weight="800" letter-spacing="-1.2">MULTIPLICATION</text>

    <!-- Subtitle Deck -->
    <text x="0" y="172" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="400">Why 1.58-Bit Ternary Weights and Pure Adder Trees</text>
    <text x="0" y="198" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="400">Are Breaking the Memory-Bandwidth Bottleneck.</text>

    <!-- Metadata Block -->
    <g transform="translate(0, 260)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      
      <text x="0" y="32" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">AUTHOR</text>
      <text x="0" y="52" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Saurav Karki</text>

      <text x="160" y="32" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">PARADIGM</text>
      <text x="160" y="52" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">BitNet b1.58 / Matmul-Free</text>

      <text x="360" y="32" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">THERMODYNAMICS</text>
      <text x="360" y="52" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">-85% Silicon Area</text>
    </g>
  </g>

  <!-- Right Side: Architectural Schematic (FP16 GEMM vs Ternary Adder Tree) -->
  <g transform="translate(630, 140)">
    <rect x="0" y="0" width="500" height="420" rx="12" fill="#0b0f17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <line x1="0" y1="46" x2="500" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="24" y="29" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2">SILICON COMPUTE SCHEMATIC</text>

    <!-- Top: Standard Floating Point GEMM -->
    <g transform="translate(24, 66)">
      <text x="0" y="0" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">CONVENTIONAL FP16 / FP8 (TENSOR CORE GEMM)</text>
      
      <!-- Box showing GEMM pipeline -->
      <rect x="0" y="12" width="452" height="110" rx="6" fill="rgba(239, 68, 68, 0.04)" stroke="rgba(239, 68, 68, 0.2)" stroke-width="1" />
      
      <g transform="translate(16, 26)">
        <rect x="0" y="0" width="105" height="34" rx="4" fill="#1e1520" stroke="#f43f5e" stroke-width="1" />
        <text x="52" y="21" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Weights (16-bit)</text>

        <text x="120" y="21" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">×</text>

        <rect x="135" y="0" width="105" height="34" rx="4" fill="#1e1520" stroke="#f43f5e" stroke-width="1" />
        <text x="187" y="21" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Activations (16-bit)</text>

        <text x="255" y="21" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">→</text>

        <rect x="270" y="0" width="150" height="34" rx="4" fill="#2d1217" stroke="#ef4444" stroke-width="1.5" />
        <text x="345" y="21" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">Floating-Point Multipliers</text>

        <!-- Stats below -->
        <text x="0" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">Energy Cost: ~1.10 pJ / MAC | Memory Traffic: 100% (Baseline)</text>
        <text x="0" y="76" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9.5">Bottleneck: Memory-Bus Saturation during Autoregressive Decoding</text>
      </g>
    </g>

    <!-- Bottom: BitNet b1.58 Ternary Adder Tree -->
    <g transform="translate(24, 230)">
      <text x="0" y="0" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">BITNET b1.58 TERNARY (MATMUL-FREE ADDER TREE)</text>
      
      <!-- Box showing Ternary pipeline -->
      <rect x="0" y="12" width="452" height="150" rx="6" fill="rgba(16, 185, 129, 0.04)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" />
      
      <g transform="translate(16, 26)">
        <rect x="0" y="0" width="115" height="34" rx="4" fill="#0d231a" stroke="#10b981" stroke-width="1.2" />
        <text x="57" y="17" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="600">Weights {-1, 0, +1}</text>
        <text x="57" y="29" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">1.58 Bits (log₂3)</text>

        <text x="130" y="21" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">+</text>

        <rect x="145" y="0" width="105" height="34" rx="4" fill="#0d231a" stroke="#10b981" stroke-width="1.2" />
        <text x="197" y="17" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="600">INT8 Activation</text>
        <text x="197" y="29" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">Dynamic Absmax</text>

        <text x="265" y="21" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">→</text>

        <rect x="280" y="0" width="140" height="34" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
        <text x="350" y="21" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">Adder Tree / MUX</text>

        <!-- Stats below -->
        <text x="0" y="58" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">NO MULTIPLICATIONS REQUIRED: y = Σ(x_pos) - Σ(x_neg)</text>
        <text x="0" y="76" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">Energy Cost: ~0.03 pJ / ADD (37x Reduction vs FP16)</text>
        <text x="0" y="94" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">Weight Compression: 10.1x | 70B Model Runs in ~14 GB RAM</text>
      </g>
    </g>
  </g>
</svg>
