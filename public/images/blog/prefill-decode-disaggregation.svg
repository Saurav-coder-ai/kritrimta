<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f" />
      <stop offset="50%" stop-color="#0c121c" />
      <stop offset="100%" stop-color="#141a26" />
    </linearGradient>
    <linearGradient id="accent-p" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="accent-d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Editorial Frame -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
  
  <!-- Masthead Kicker -->
  <text x="70" y="80" fill="#00d2ff" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="4" font-weight="600">KRITRIMTA ARCHITECTURE LABS // SYSTEMS BENCHMARK</text>
  <line x1="70" y1="96" x2="1130" y2="96" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Left Side: Editorial Typography -->
  <g transform="translate(70, 150)">
    <rect x="0" y="0" width="140" height="24" rx="4" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="1"/>
    <text x="70" y="16" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">SYSTEMS ARCHITECTURE</text>

    <text x="0" y="65" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="38" font-weight="800">
      <tspan x="0" dy="0">The Death of the</tspan>
      <tspan x="0" dy="48">Monolithic GPU Node</tspan>
    </text>

    <text x="0" y="180" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="400">
      <tspan x="0" dy="0">Why Prefill-Decode Disaggregation and Distributed KV</tspan>
      <tspan x="0" dy="26">Fabrics are breaking the inference economics wall.</tspan>
    </text>

    <g transform="translate(0, 240)">
      <circle cx="16" cy="16" r="16" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="16" y="21" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">SK</text>
      <text x="44" y="14" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Saurav Karki</text>
      <text x="44" y="28" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Chief Editor // Sep 10, 2026</text>
    </g>

    <!-- Stat Pills -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="135" height="42" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="14" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1">PREFILL INTENSITY</text>
      <text x="14" y="34" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">>150 FLOP/B</text>

      <rect x="150" y="0" width="135" height="42" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="164" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1">DECODE INTENSITY</text>
      <text x="164" y="34" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">~1.0 FLOP/B</text>

      <rect x="300" y="0" width="135" height="42" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="314" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1">TAIL JITTER SLICE</text>
      <text x="314" y="34" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">-82% P99 ITL</text>
    </g>
  </g>

  <!-- Right Side: Architectural Schematic (Disaggregated Topology) -->
  <g transform="translate(620, 130)">
    <rect x="0" y="0" width="510" height="430" rx="12" fill="#0b0f17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <line x1="0" y1="46" x2="510" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="24" y="29" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2">SPLIT-PHASE DISAGGREGATION TOPOLOGY</text>

    <!-- Top Tier: Prefill Node Pool -->
    <g transform="translate(25, 65)">
      <rect x="0" y="0" width="460" height="95" rx="8" fill="rgba(244, 63, 94, 0.08)" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="18" y="24" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">PREFILL CLUSTER (P-NODES) // COMPUTE BOUND</text>
      <text x="18" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Optimized for Tensor Cores, High TFLOPs &amp; Dense Parallel GEMMs</text>
      
      <!-- Mini Nodes -->
      <g transform="translate(18, 55)">
        <rect x="0" y="0" width="95" height="26" rx="4" fill="#1e1b2e" stroke="#f43f5e" stroke-width="1"/>
        <text x="47" y="17" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">P-Worker 01</text>

        <rect x="105" y="0" width="95" height="26" rx="4" fill="#1e1b2e" stroke="#f43f5e" stroke-width="1"/>
        <text x="152" y="17" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">P-Worker 02</text>

        <rect x="210" y="0" width="95" height="26" rx="4" fill="#1e1b2e" stroke="#f43f5e" stroke-width="1"/>
        <text x="257" y="17" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">P-Worker 03</text>

        <rect x="315" y="0" width="110" height="26" rx="4" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" stroke-width="1"/>
        <text x="370" y="17" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Chunked Prefill</text>
      </g>
    </g>

    <!-- Middle Tier: RDMA / RoCEv2 KV Fabric -->
    <g transform="translate(25, 180)">
      <rect x="0" y="0" width="460" height="65" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="230" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">400Gbps RDMA / RoCEv2 GPUDirect KV FABRIC</text>
      <text x="230" y="44" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Direct HBM-to-HBM Remote KV Transfer (Zero-Copy NIXL/LMCache)</text>
    </g>

    <!-- Bottom Tier: Decode Node Pool -->
    <g transform="translate(25, 265)">
      <rect x="0" y="0" width="460" height="140" rx="8" fill="rgba(56, 189, 248, 0.06)" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="18" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">DECODE CLUSTER (D-NODES) // MEMORY-BANDWIDTH BOUND</text>
      <text x="18" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Optimized for HBM Bandwidth, High Batch Concurrency &amp; Low Inter-Token Jitter</text>

      <!-- Worker nodes in Decode -->
      <g transform="translate(18, 54)">
        <rect x="0" y="0" width="135" height="36" rx="4" fill="#0c2035" stroke="#38bdf8" stroke-width="1"/>
        <text x="67" y="18" fill="#e0f2fe" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">D-Worker A (HBM3e)</text>
        <text x="67" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Streams User #1..64</text>

        <rect x="145" y="0" width="135" height="36" rx="4" fill="#0c2035" stroke="#38bdf8" stroke-width="1"/>
        <text x="212" y="18" fill="#e0f2fe" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">D-Worker B (HBM3e)</text>
        <text x="212" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Streams User #65..128</text>

        <rect x="290" y="0" width="135" height="36" rx="4" fill="#0c2035" stroke="#38bdf8" stroke-width="1"/>
        <text x="357" y="18" fill="#e0f2fe" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Distributed Tier</text>
        <text x="357" y="30" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">DRAM / NVMe Spill</text>
      </g>

      <!-- Bottom Tag -->
      <g transform="translate(18, 102)">
        <rect x="0" y="0" width="425" height="24" rx="4" fill="#071524" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
        <text x="212" y="16" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Result: Zero Head-of-Line Blocking // Predictable Real-Time Tokens</text>
      </g>
    </g>
  </g>
</svg>
