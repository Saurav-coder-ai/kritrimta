<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="520" fill="url(#bg2)" />
  <rect width="1000" height="520" fill="url(#grid2)" />
  <rect x="20" y="20" width="960" height="480" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Header -->
  <text x="50" y="55" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="3" font-weight="600">FIG 1.1 // MECHANICAL KINEMATICS &amp; LAYER STACK</text>
  <text x="50" y="85" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800">The iPhone Duo Liquidmetal Teardrop Hinge &amp; Zero-Crease Stack</text>
  <line x1="50" y1="105" x2="950" y2="105" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Left: Fold Cross-Section Diagram -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="420" height="330" rx="8" fill="#0b0f17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="20" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">CLOSED TEARDROP CROSS-SECTION</text>
    <text x="20" y="50" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Radius of curvature expanded to R = 3.2mm to eliminate tensile fatigue</text>

    <!-- Top Wing (Folded) -->
    <rect x="40" y="80" width="220" height="14" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="150" y="91" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Upper Display Wing (Grade 5 Titanium)</text>

    <!-- Bottom Wing (Folded) -->
    <rect x="40" y="160" width="220" height="14" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="150" y="171" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Lower Display Wing (Dual-Cell Battery Body)</text>

    <!-- Teardrop OLED Path Curve -->
    <path d="M 260 87 C 340 87, 360 110, 360 127 C 360 144, 340 167, 260 167" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <text x="350" y="200" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Teardrop Internal Cavity</text>

    <!-- Hinge Mechanism Gears -->
    <g transform="translate(160, 115)">
      <circle cx="20" cy="12" r="14" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
      <circle cx="48" cy="12" r="14" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
      <circle cx="76" cy="12" r="14" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="48" y="16" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">SYNCHRO</text>
    </g>

    <!-- Engineering Specs in Box -->
    <g transform="translate(20, 230)">
      <rect x="0" y="0" width="380" height="80" rx="6" fill="#07101a" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
      <text x="15" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">KINEMATIC SPECIFICATIONS:</text>
      <text x="15" y="44" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• 100+ CNC Liquidmetal gears &amp; titanium cam elements</text>
      <text x="15" y="64" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• Zero-gap magnetic perimeter seal with IP68 fluid gasket</text>
    </g>
  </g>

  <!-- Right: 7-Layer Zero-Crease Stack -->
  <g transform="translate(510, 130)">
    <rect x="0" y="0" width="430" height="330" rx="8" fill="#0b0f17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="20" y="30" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">EXPLODED NANO-TEXTURE UTG SUBSTRATE</text>
    <text x="20" y="50" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">How Apple eliminated tactile crease grooves and surface glare</text>

    <!-- Layer 1 -->
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="390" height="24" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="16" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="10">1. Anti-Reflective Nano-Texture Etched Top Layer (0.05mm)</text>
    </g>
    <!-- Layer 2 -->
    <g transform="translate(20, 102)">
      <rect x="0" y="0" width="390" height="24" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
      <text x="15" y="16" fill="#bfdbfe" font-family="'JetBrains Mono', monospace" font-size="10">2. Chemically Strengthened Ultra-Thin Glass (UTG 30µm)</text>
    </g>
    <!-- Layer 3 -->
    <g transform="translate(20, 134)">
      <rect x="0" y="0" width="390" height="24" rx="4" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1"/>
      <text x="15" y="16" fill="#ddd6fe" font-family="'JetBrains Mono', monospace" font-size="10">3. Apple Pencil Resilient Digitizer &amp; Shock-Absorbing OCA</text>
    </g>
    <!-- Layer 4 -->
    <g transform="translate(20, 166)">
      <rect x="0" y="0" width="390" height="24" rx="4" fill="#831843" stroke="#ec4899" stroke-width="1"/>
      <text x="15" y="16" fill="#fbcfe8" font-family="'JetBrains Mono', monospace" font-size="10">4. Tandem OLED Emissive Array (Super Retina XDR 1-120Hz)</text>
    </g>
    <!-- Layer 5 -->
    <g transform="translate(20, 198)">
      <rect x="0" y="0" width="390" height="24" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
      <text x="15" y="16" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="10">5. Under-Display Face ID &amp; Optical Sensor Apertures</text>
    </g>
    <!-- Layer 6 -->
    <g transform="translate(20, 230)">
      <rect x="0" y="0" width="390" height="24" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="15" y="16" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">6. Carbon-Fiber &amp; Titanium Stress-Dispersion Support Plate</text>
    </g>
    <!-- Layer 7 -->
    <g transform="translate(20, 262)">
      <rect x="0" y="0" width="390" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="15" y="16" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">7. Graphite Thermal Dissipation Sheet &amp; Vapor Chamber Gasket</text>
    </g>
  </g>
</svg>
