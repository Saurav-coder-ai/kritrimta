<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-amber" cx="70%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0e131b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#253040"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0d1117"/>
  <rect width="1200" height="630" fill="url(#dot-grid)"/>
  <rect width="1200" height="630" fill="url(#glow-amber)"/>

  <!-- Editorial Stamp -->
  <rect x="70" y="60" width="180" height="28" rx="4" fill="#1b222d" stroke="#2c3748" stroke-width="1"/>
  <text x="85" y="78" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#f59e0b" letter-spacing="2">KRITRIMTA · DISPATCH</text>
  <text x="1130" y="80" font-family="'JetBrains Mono', monospace" font-size="12" fill="#546376" text-anchor="end">ANALYSIS // MULTIMODAL HORIZONS</text>

  <!-- Attention Matrix / Vector Flow Graphic -->
  <g transform="translate(640, 130)">
    <!-- Layer boxes -->
    <g fill="none" stroke="#2b384c" stroke-width="1.5">
      <polygon points="200,30 400,100 200,170 0,100" fill="#131b26" stroke="#f59e0b" stroke-opacity="0.6"/>
      <polygon points="200,120 400,190 200,260 0,190" fill="#131b26" fill-opacity="0.7"/>
      <polygon points="200,210 400,280 200,350 0,280" fill="#131b26" fill-opacity="0.4"/>
    </g>
    <!-- Latent Vectors -->
    <line x1="200" y1="10" x2="200" y2="360" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="200" cy="100" r="6" fill="#f59e0b"/>
    <circle cx="200" cy="190" r="5" fill="#f59e0b" fill-opacity="0.7"/>
    <circle cx="200" cy="280" r="4" fill="#f59e0b" fill-opacity="0.5"/>

    <!-- Dimension labels -->
    <text x="420" y="105" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b">1M TOKENS CONTEXT</text>
    <text x="420" y="195" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8093ab">CROSS-ATTENTION AUDIO/VIS</text>
    <text x="420" y="285" font-family="'JetBrains Mono', monospace" font-size="11" fill="#58677c">REASONING LATENTS</text>
  </g>

  <!-- Headline typography -->
  <text x="70" y="260" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#f5f0eb" letter-spacing="-1">The Frontier of</text>
  <text x="70" y="325" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#f59e0b" letter-spacing="-1">Multimodal Reason</text>

  <text x="70" y="390" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#8f9eb2">
    Inside GPT-5’s architecture: beyond next-token prediction into world models.
  </text>

  <!-- Metadata -->
  <line x1="70" y1="520" x2="1130" y2="520" stroke="#202937" stroke-width="1"/>
  <text x="70" y="555" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6c7c91">BY SAURAV KARKI</text>
  <text x="320" y="555" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6c7c91">CATEGORY: TECH NEWS</text>
  <text x="620" y="555" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6c7c91">SPECIAL REPORT // AI FRONTIER</text>
  <text x="1130" y="555" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f59e0b" text-anchor="end">KRITRIMTA.COM</text>
</svg>
