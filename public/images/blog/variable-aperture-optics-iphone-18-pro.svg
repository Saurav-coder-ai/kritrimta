<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f" />
      <stop offset="100%" stop-color="#141824" />
    </linearGradient>
    <pattern id="grid4" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="520" fill="url(#bg4)" />
  <rect width="1000" height="520" fill="url(#grid4)" />
  <rect x="20" y="20" width="960" height="480" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Header -->
  <text x="50" y="55" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="3" font-weight="600">FIG 3.1 // COMPUTATIONAL &amp; PHYSICAL OPTICS</text>
  <text x="50" y="85" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800">iPhone 18 Pro Variable Aperture: Physical Iris vs Sensor MTF</text>
  <line x1="50" y1="105" x2="950" y2="105" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Left: f/1.5 Wide Open Mode (Low Light & Bokeh) -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="410" height="330" rx="8" fill="#0b0f17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="20" y="30" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">MODE A: WIDE OPEN (f/1.5)</text>
    <text x="20" y="50" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Maximum photon flux capture &amp; genuine optical shallow depth-of-field</text>

    <!-- Circular Iris Diagram -->
    <g transform="translate(145, 75)">
      <circle cx="60" cy="60" r="55" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
      <!-- Wide Aperture hole -->
      <circle cx="60" cy="60" r="42" fill="#030712" stroke="#fb7185" stroke-width="1.5"/>
      <text x="60" y="65" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">f/1.5</text>
    </g>

    <g transform="translate(20, 215)">
      <rect x="0" y="0" width="370" height="95" rx="6" fill="#1c0a10" stroke="rgba(244, 63, 94, 0.2)" stroke-width="1"/>
      <text x="15" y="24" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">PHYSICAL IMPLICATIONS:</text>
      <text x="15" y="44" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• Ingests 2.3× more photons vs f/2.2 for sub-lux Night Mode</text>
      <text x="15" y="64" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• Eliminates synthetic edge-blurring artifacts in portraiture</text>
      <text x="15" y="84" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• Natural creamy circular optical bokeh from 6 curved blades</text>
    </g>
  </g>

  <!-- Right: f/4.0 Stopped Down Mode (Edge Sharpness & Macro) -->
  <g transform="translate(510, 130)">
    <rect x="0" y="0" width="430" height="330" rx="8" fill="#0b0f17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="20" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">MODE B: STOPPED DOWN (f/4.0)</text>
    <text x="20" y="50" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Maximum Modulation Transfer Function (MTF) &amp; deep focal plane</text>

    <!-- Circular Iris Diagram -->
    <g transform="translate(155, 75)">
      <circle cx="60" cy="60" r="55" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <!-- Stopped Down Aperture hole -->
      <circle cx="60" cy="60" r="16" fill="#030712" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="60" cy="60" r="55" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
      <!-- Iris blades visual -->
      <line x1="20" y1="40" x2="50" y2="46" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="70" y1="46" x2="100" y2="40" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="100" y1="75" x2="72" y2="70" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="60" y="65" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">f/4</text>
    </g>

    <g transform="translate(20, 215)">
      <rect x="0" y="0" width="390" height="95" rx="6" fill="#071827" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
      <text x="15" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">OPTICAL ADVANTAGES:</text>
      <text x="15" y="44" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• Eliminates spherical aberration and corner softness in documents</text>
      <text x="15" y="64" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• Deep focus: Both foreground subject and background remain sharp</text>
      <text x="15" y="84" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• Diffraction-limited 48MP resolution across the full 1/1.14" sensor</text>
    </g>
  </g>
</svg>
