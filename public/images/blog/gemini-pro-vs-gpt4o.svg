<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b10" />
      <stop offset="50%" stop-color="#0f1520" />
      <stop offset="100%" stop-color="#161c28" />
    </linearGradient>
    <linearGradient id="gemini-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="50%" stop-color="#9B72CB" />
      <stop offset="100%" stop-color="#D96570" />
    </linearGradient>
    <linearGradient id="openai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f" />
      <stop offset="100%" stop-color="#e0532b" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Editorial Frame -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  
  <!-- Masthead Kicker -->
  <text x="70" y="80" fill="#e0532b" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="4" font-weight="600">KRITRIMTA BENCHMARK LABS // FIELD EVALUATION</text>
  <line x1="70" y1="96" x2="1130" y2="96" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Dual Model Comparison Radar / Vector Visualization -->
  <!-- Left Side: Gemini 2.5 Pro 1M Context Node -->
  <g transform="translate(680, 160)">
    <!-- Decorative Coordinate Box -->
    <rect x="0" y="0" width="450" height="380" rx="12" fill="#0d1118" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <line x1="0" y1="50" x2="450" y2="50" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="25" y="32" fill="#8b9bb4" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2">BENCHMARK METRICS &amp; EVALUATION MATRIX</text>
    
    <!-- Radar Graph / Multi-Axis Background -->
    <g transform="translate(225, 215)">
      <!-- Concentric Hexagons -->
      <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
      <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      
      <!-- Axis Lines -->
      <line x1="0" y1="-130" x2="0" y2="130" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <line x1="-115" y1="-65" x2="115" y2="65" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <line x1="-115" y1="65" x2="115" y2="-65" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

      <!-- Axis Labels -->
      <text x="0" y="-138" fill="#a0aec0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">CONTEXT (1M)</text>
      <text x="125" y="-55" fill="#a0aec0" font-family="'JetBrains Mono', monospace" font-size="11">MMLU PRO</text>
      <text x="125" y="70" fill="#a0aec0" font-family="'JetBrains Mono', monospace" font-size="11">SWE-BENCH</text>
      <text x="0" y="148" fill="#a0aec0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">COST/TOKEN</text>
      <text x="-125" y="70" fill="#a0aec0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">JSON STRICT</text>
      <text x="-125" y="-55" fill="#a0aec0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">MULTIMODAL</text>

      <!-- Gemini Polygon (Blue/Purple) -->
      <polygon points="0,-115 95,-55 65,38 -45,90 -65,38 -100,-58" fill="rgba(66, 133, 244, 0.18)" stroke="#4285F4" stroke-width="2.5"/>
      <!-- GPT-4o Polygon (Orange/Green) -->
      <polygon points="0,-45 92,-52 75,44 -85,110 -95,55 -70,-40" fill="rgba(224, 83, 43, 0.18)" stroke="#e0532b" stroke-width="2.5" stroke-dasharray="4 3"/>
    </g>

    <!-- Legend -->
    <g transform="translate(25, 345)">
      <circle cx="8" cy="8" r="6" fill="#4285F4"/>
      <text x="22" y="12" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">Gemini 2.5 Pro</text>
      <circle cx="160" cy="8" r="6" fill="#e0532b"/>
      <text x="174" y="12" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">GPT-4o</text>
    </g>
  </g>

  <!-- Left Main Editorial Title & Copy -->
  <g transform="translate(70, 180)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="165" height="32" rx="4" fill="rgba(224, 83, 43, 0.15)" stroke="#e0532b" stroke-width="1"/>
    <text x="14" y="21" fill="#e0532b" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1">MODEL BENCHMARK</text>

    <!-- Main Headline -->
    <text x="0" y="85" fill="#ffffff" font-family="'Newsreader', Georgia, serif" font-size="52" font-weight="700" letter-spacing="-1">Gemini 2.5 Pro</text>
    <text x="0" y="145" fill="#e0532b" font-family="'Newsreader', Georgia, serif" font-size="52" font-style="italic" font-weight="400">vs</text>
    <text x="70" y="145" fill="#ffffff" font-family="'Newsreader', Georgia, serif" font-size="52" font-weight="700" letter-spacing="-1">GPT-4o</text>

    <!-- Subtitle / Analytical Hook -->
    <text x="0" y="215" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="400">Beyond MMLU Leaderboards:</text>
    <text x="0" y="245" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="500">What Frontier Evals Actually Measure</text>

    <!-- Technical Specs Tag Box -->
    <g transform="translate(0, 290)">
      <rect x="0" y="0" width="550" height="60" rx="8" fill="#0d1118" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="20" y="35" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">1M CONTEXT</text>
      <text x="130" y="35" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="12">|</text>
      <text x="155" y="35" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">SWE-BENCH VERIFIED</text>
      <text x="325" y="35" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="12">|</text>
      <text x="350" y="35" fill="#e0532b" font-family="'JetBrains Mono', monospace" font-size="12">HELMET RECALL</text>
    </g>
  </g>

  <!-- Bottom Colophon -->
  <text x="70" y="570" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12">KRITRIMTA JOURNAL // REPORT NO. 26-08 // SAURAV KARKI</text>
  <text x="1130" y="570" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="end">FIRST-PRINCIPLES SILICON &amp; AI REVIEW</text>
</svg>
