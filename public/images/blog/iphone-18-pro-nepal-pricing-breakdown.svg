<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bg-breakdown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid-breakdown" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="520" fill="url(#bg-breakdown)" />
  <rect width="1000" height="520" fill="url(#grid-breakdown)" />
  <rect x="20" y="20" width="960" height="480" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Header -->
  <text x="50" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="3" font-weight="600">FIG 1.1 // TAXONOMY &amp; CUSTOMS TARIFF ECONOMICS</text>
  <text x="50" y="85" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800">Why Does the iPhone 18 Pro Cost NPR 264,000 in Nepal?</text>
  <line x1="50" y1="105" x2="950" y2="105" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Left: Price Component Breakdown Stack -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="430" height="330" rx="8" fill="#0b0f17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="20" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">COST ARCHITECTURE BREAKDOWN (256GB)</text>

    <!-- Component 1: Base US Price -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="390" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="15" y="22" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">1. BASE CONVERSION (USD $1,199 @ 135.5)</text>
      <text x="15" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Raw landed exchange rate price before tariffs</text>
      <text x="375" y="28" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="end">~NPR 162,500</text>
    </g>

    <!-- Component 2: 5% Customs Duty -->
    <g transform="translate(20, 115)">
      <rect x="0" y="0" width="390" height="45" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="15" y="22" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">2. NEPAL CUSTOMS TARIFF (5% EXCISE)</text>
      <text x="15" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Levied at Tribhuvan International Airport customs</text>
      <text x="375" y="28" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="end">+NPR 8,125</text>
    </g>

    <!-- Component 3: 13% Value Added Tax (VAT) -->
    <g transform="translate(20, 170)">
      <rect x="0" y="0" width="390" height="45" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
      <text x="15" y="22" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">3. VALUE ADDED TAX (13% VAT)</text>
      <text x="15" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Mandatory Government of Nepal statutory tax</text>
      <text x="375" y="28" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="end">+NPR 22,180</text>
    </g>

    <!-- Component 4: Distributor Margin, Freight & Insurance -->
    <g transform="translate(20, 225)">
      <rect x="0" y="0" width="390" height="45" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="22" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">4. GENXT MARGIN, MDMS &amp; 1-YR INSURANCE</text>
      <text x="15" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">NTA MDMS registration, 1-yr screen replacement</text>
      <text x="375" y="28" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="end">+NPR 71,195</text>
    </g>

    <!-- Total Row -->
    <g transform="translate(20, 280)">
      <rect x="0" y="0" width="390" height="35" rx="4" fill="#0284c7"/>
      <text x="15" y="23" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">FINAL OFFICIAL MAXIMUM RETAIL PRICE (MRP)</text>
      <text x="375" y="24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="end">NPR 264,000</text>
    </g>
  </g>

  <!-- Right: Official Authorized vs Grey Market Grey Warning -->
  <g transform="translate(510, 130)">
    <rect x="0" y="0" width="440" height="330" rx="8" fill="#0b0f17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="20" y="30" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">OFFICIAL CHANNELS VS GREY MARKET</text>

    <!-- Official Channel Box -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="400" height="120" rx="6" fill="#062e24" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="24" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">AUTHORIZED PURCHASE (GENXT / OLIZ / EVO):</text>
      <text x="15" y="48" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">✓ Pre-registered with NTA MDMS (Zero SIM blockage)</text>
      <text x="15" y="68" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">✓ 1-Year Apple Warranty + 1-Year Breakage Insurance</text>
      <text x="15" y="88" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">✓ Genuine VAT Bill for corporate / individual tax deduction</text>
      <text x="15" y="108" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">✓ 0% Interest EMI facilities from major commercial banks</text>
    </g>

    <!-- Grey Market Box -->
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="400" height="120" rx="6" fill="#2d060d" stroke="#ef4444" stroke-width="1"/>
      <text x="15" y="24" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">UNOFFICIAL / GREY MARKET IMPORTS (RISKS):</text>
      <text x="15" y="48" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">✗ Risk of SIM deactivation under NTA MDMS regulations</text>
      <text x="15" y="68" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">✗ Additional NPR 10,000+ government MDMS penalty fee</text>
      <text x="15" y="88" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">✗ No domestic breakage warranty or certified replacement parts</text>
      <text x="15" y="108" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">✗ Regional eSIM compatibility locks from US carrier batches</text>
    </g>
  </g>
</svg>
