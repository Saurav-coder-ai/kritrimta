<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f" />
      <stop offset="50%" stop-color="#0c121c" />
      <stop offset="100%" stop-color="#141a26" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3a7bd5" />
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#00d2ff" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Editorial Frame -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  
  <!-- Masthead Kicker -->
  <text x="70" y="80" fill="#00d2ff" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="4" font-weight="600">KRITRIMTA SYSTEMS &amp; ARCHITECTURE // ESSAY #14</text>
  <line x1="70" y1="96" x2="1130" y2="96" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Left Side: Editorial Typography -->
  <g transform="translate(70, 145)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="148" height="26" rx="4" fill="rgba(0, 210, 255, 0.1)" stroke="#00d2ff" stroke-width="1"/>
    <text x="74" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.5">SYSTEMS RUNTIME</text>

    <!-- Main Title -->
    <text x="0" y="75" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5">THE AGENT HARNESS</text>
    <text x="0" y="130" fill="url(#accent-cyan)" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5">&amp; MCP REVOLUTION</text>

    <!-- Subtitle Deck -->
    <text x="0" y="180" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="400">Why Prompt Engineering Is Dead and Runtime Scaffolding</text>
    <text x="0" y="206" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="400">Is the Real AI Substrate.</text>

    <!-- Metadata Block -->
    <g transform="translate(0, 270)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      
      <text x="0" y="32" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">AUTHOR</text>
      <text x="0" y="52" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Saurav Karki</text>

      <text x="160" y="32" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">DISPATCH DATE</text>
      <text x="160" y="52" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">September 2026</text>

      <text x="320" y="32" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">CORE PROTOCOL</text>
      <text x="320" y="52" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">MCP (JSON-RPC)</text>
    </g>
  </g>

  <!-- Right Side: Architectural Schematic Card -->
  <g transform="translate(630, 130)">
    <rect x="0" y="0" width="500" height="430" rx="12" fill="#0b0f17" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <line x1="0" y1="44" x2="500" y2="44" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="42" cy="22" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="60" cy="22" r="5" fill="#10b981" opacity="0.8" />
    <text x="84" y="27" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1.5">AGENT RUNTIME TOPOLOGY: MODEL + HARNESS</text>

    <!-- Stack Diagram -->
    <!-- 1. The Reasoning Core -->
    <g transform="translate(30, 65)">
      <rect x="0" y="0" width="440" height="60" rx="8" fill="rgba(192, 132, 252, 0.08)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" />
      <text x="20" y="26" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">LAYER 3: THE PROBABILISTIC REASONING CORE</text>
      <text x="20" y="47" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Frontier LLM (Weights Converged: ~90% MMLU)</text>
    </g>

    <!-- Connector 1 -->
    <line x1="250" y1="125" x2="250" y2="150" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="250,154 246,146 254,146" fill="#38bdf8" />

    <!-- 2. The Universal Interoperability Bus (MCP) -->
    <g transform="translate(30, 155)">
      <rect x="0" y="0" width="440" height="74" rx="8" fill="rgba(0, 210, 255, 0.08)" stroke="#00d2ff" stroke-width="1.5" />
      <text x="20" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">LAYER 2: UNIVERSAL PROTOCOL BUS (MCP CLIENT / SERVER)</text>
      <text x="20" y="45" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Model Context Protocol: Stateless JSON-RPC</text>
      <text x="20" y="62" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Resources (Context) │ Tools (Actions) │ Prompts (Workflows)</text>
    </g>

    <!-- Connector 2 -->
    <line x1="250" y1="229" x2="250" y2="254" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="250,258 246,250 254,250" fill="#10b981" />

    <!-- 3. The Deterministic Harness & Sandbox -->
    <g transform="translate(30, 259)">
      <rect x="0" y="0" width="440" height="96" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="#10b981" stroke-width="1.5" />
      <text x="20" y="24" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">LAYER 1: DETERMINISTIC HARNESS &amp; EXECUTION ENVIRONMENT</text>
      
      <!-- Sub-blocks -->
      <rect x="15" y="36" width="125" height="46" rx="4" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="77" y="55" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">Deterministic</text>
      <text x="77" y="70" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Verifiers (Tests)</text>

      <rect x="155" y="36" width="125" height="46" rx="4" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="217" y="55" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">MicroVM / Pod</text>
      <text x="217" y="70" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Sandboxed Exec</text>

      <rect x="295" y="36" width="130" height="46" rx="4" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="360" y="55" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">Git Worktree</text>
      <text x="360" y="70" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">State Rollback</text>
    </g>

    <!-- Bottom Mathematical Metric -->
    <g transform="translate(30, 375)">
      <rect x="0" y="0" width="440" height="38" rx="6" fill="#0f172a" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
      <text x="15" y="24" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Compound Error: P(success) = p^n</text>
      <text x="250" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">↳ Harness rescues p^n via rollback</text>
    </g>
  </g>
</svg>
